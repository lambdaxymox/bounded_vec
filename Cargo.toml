[package]
name = "bounded_vec"
version = "1.0.0"
edition = "2024"
authors = ["LambdaXymox <lambda.xymox@gmail.com>"]
description = "A library for working with bounded capacity growable arrays."
categories = [
    "data-structures",
    "no-std",
]
keywords = [
    "containers",
    "no_std",
]
license = "Apache-2.0 OR MIT"
readme = "README.md"
repository = "https://github.com/lambdaxymox/bounded_vec"

[features]
default = ["std"]
std = []
nightly = []

[dependencies]
allocator-api2 = { version = "0.4", default-features = false, features = ["alloc"] }

[dev-dependencies]
criterion = { version = "0.8.2" }
proptest = { version = "1.12.0" }

[[bench]]
name = "bench_bounded_vec"
harness = false
path = "benches/lib.rs"
